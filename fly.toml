# fly.toml app configuration file for musicbot-dgxowq
#
# This is a long-polling Telegram bot, NOT a web service. Auto-stop must be
# off (a stopped machine = a stopped bot), and at least 1 machine must always
# be running. The [http_service] block exists only so Fly's proxy has a
# health endpoint to talk to (bot.py serves "ok" on port 8080).
#
# See https://fly.io/docs/reference/configuration/ for full options.

app = 'musicbot-dgxowq'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory_mb = 512
  cpu_kind = 'shared'
  cpus = 1
